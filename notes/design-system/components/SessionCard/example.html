<!doctype html>
<html lang="en-GB" data-theme="light">
<head><meta charset="utf-8"><title>SessionCard — example</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/singology.css">
<script>if (/[?&]theme=dark/.test(location.search)) document.documentElement.setAttribute("data-theme", "dark");</script>
</head>
<body style="margin:0">
<div class="sg-root" style="padding:24px; background:var(--surface-alt)">
  <article class="sg-session" style="max-width:620px">
    <div class="sg-session__date" aria-hidden="true">
      <span class="sg-session__month">Oct</span>
      <span class="sg-session__day">20</span>
      <span class="sg-session__weekday">Tue</span>
    </div>
    <div class="sg-session__body">
      <div class="sg-session__top">
        <h3 class="sg-session__title">Breath support &amp; belting</h3>
        <span class="sg-tag sg-tag--confirmed">Confirmed</span>
      </div>
      <p class="sg-session__coach">with Founder</p>
      <p class="sg-session__meta"><time datetime="2026-10-20T18:30">Tuesday 20 October, 18:30–19:15</time> · Video call</p>
      <div class="sg-session__actions">
        <a class="sg-btn sg-btn--primary sg-btn--small" href="#">Join session</a>
        <a class="sg-btn sg-btn--secondary sg-btn--small" href="#">Reschedule</a>
      </div>
    </div>
  </article>
</div>
</body>
</html>
