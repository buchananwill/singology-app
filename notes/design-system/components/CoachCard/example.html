<!doctype html>
<html lang="en-GB" data-theme="light">
<head><meta charset="utf-8"><title>CoachCard — example</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/singology.css">
<script>if (/[?&]theme=dark/.test(location.search)) document.documentElement.setAttribute("data-theme", "dark");</script>
</head>
<body style="margin:0">
<div class="sg-root">
  <div class="sg-panel sg-panel--tint" style="padding:32px 24px">
   <div class="sg-coach-row">
    <article class="sg-coach">
      <div class="sg-coach__portrait" role="img" aria-label="Number One">1</div>
      <h3 class="sg-coach__name">Number One<span class="sg-coach__sep">|</span>South Croydon</h3>
      <p class="sg-coach__meta">Confidence, breath support, pop &amp; musical theatre</p>
      <a class="sg-btn sg-btn--coach" href="#">View profile</a>
    </article>
    <article class="sg-coach">
      <div class="sg-coach__portrait" role="img" aria-label="Founder">F</div>
      <h3 class="sg-coach__name">Founder<span class="sg-coach__sep">|</span>Wimbledon</h3>
      <p class="sg-coach__meta">Gospel, harmony, range and belting</p>
      <a class="sg-btn sg-btn--coach" href="#">View profile</a>
    </article>
   </div>
  </div>
</div>
</body>
</html>
