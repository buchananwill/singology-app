<!doctype html>
<html lang="en-GB" data-theme="light">
<head><meta charset="utf-8"><title>Panel — example</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/singology.css">
<script>if (/[?&]theme=dark/.test(location.search)) document.documentElement.setAttribute("data-theme", "dark");</script>
</head>
<body style="margin:0">
<div class="sg-root">
  <div class="sg-panel sg-panel--brand" style="padding:32px">
    <div class="sg-panel sg-panel--stage" style="max-width:640px">
      <p class="sg-eyebrow">One-to-one coaching</p>
      <h1 class="sg-display">Find your voice</h1>
      <p class="sg-lead">Weekly sessions with a Singology coach, from your first warm-up to your first solo.</p>
      <div style="display:flex; gap:12px; flex-wrap:wrap; padding-top:8px">
        <a class="sg-btn sg-btn--primary" href="#">Book a free taster</a>
        <a class="sg-btn sg-btn--secondary" href="#">Meet the coaches</a>
      </div>
    </div>
  </div>
  <div class="sg-panel sg-panel--tint" style="padding:32px">
    <p class="sg-eyebrow" style="color:var(--accent-olive)">Meet your coach</p>
    <p class="sg-voice">Get to know the team who'll be in your corner every week. We think they're all brilliant, and we're betting you'll agree!</p>
  </div>
</div>
</body>
</html>
